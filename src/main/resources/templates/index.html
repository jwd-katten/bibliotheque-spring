<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque ENSAF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }
        header {
            background: #1f4e79;
            color: white;
            padding: 25px;
            text-align: center;
        }
        main {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1f4e79;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #1f4e79;
            color: white;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        .btn {
            background: #1f4e79;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .btn:hover {
            background: #163a5c;
        }
        .btn-danger {
            background: #c0392b;
        }
        .btn-danger:hover {
            background: #a93226;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .section {
            margin-top: 30px;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-bar input {
            flex: 1;
        }
    </style>
</head>
<body>

<header>
    <h1>📚 Bibliothèque ENSAF</h1>
    <p>Gestion de la bibliothèque — Version Spring Boot (JPA / REST / Thymeleaf)</p>
</header>

<main>
    <h2>Catalogue des Livres</h2>

    <div class="section">
        <h3>Ajouter un livre</h3>
        <form action="/api/livres" method="post" id="addLivreForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="titre">Titre</label>
                    <input type="text" id="titre" name="titre" required>
                </div>
                <div class="form-group">
                    <label for="editeur">Éditeur</label>
                    <input type="text" id="editeur" name="editeur">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="annee">Année</label>
                    <input type="number" id="annee" name="annee">
                </div>
                <div class="form-group">
                    <label for="nbExemplaires">Nb Exemplaires</label>
                    <input type="number" id="nbExemplaires" name="nbExemplaires" value="1">
                </div>
                <div class="form-group">
                    <label for="categorie">Catégorie</label>
                    <select id="categorie" name="categorie">
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                    </select>
                </div>
            </div>
        </form>
        <button class="btn" onclick="submitLivre()">Ajouter</button>
    </div>

    <div class="section">
        <h3>Liste des livres</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Titre</th>
                    <th>Année</th>
                    <th>Éditeur</th>
                    <th>Catégorie</th>
                    <th>Exemplaires</th>
                    <th>Auteurs</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="livre : ${livres}">
                    <td th:text="${livre.id}"></td>
                    <td th:text="${livre.titre}"></td>
                    <td th:text="${livre.annee}"></td>
                    <td th:text="${livre.editeur}"></td>
                    <td th:text="${livre.categorie}"></td>
                    <td th:text="${livre.nbExemplaires}"></td>
                    <td>
                        <span th:each="auteur, iterStat : ${livre.auteurs}">
                            <span th:text="${auteur.prenom + ' ' + auteur.nom}"></span>
                            <span th:if="${!iterStat.last}">, </span>
                        </span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(livres)}">
                    <td colspan="7" style="text-align:center;">Aucun livre dans le catalogue.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    function submitLivre() {
        var form = document.getElementById('addLivreForm');
        var data = {
            titre: document.getElementById('titre').value,
            editeur: document.getElementById('editeur').value,
            annee: parseInt(document.getElementById('annee').value) || 0,
            nbExemplaires: parseInt(document.getElementById('nbExemplaires').value) || 1,
            categorie: document.getElementById('categorie').value,
            auteurs: []
        };

        fetch('/api/livres', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(function(response) {
            if (response.ok) {
                window.location.reload();
            }
        });
    }
</script>

</body>
</html>
